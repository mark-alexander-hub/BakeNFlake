<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#2C1810"/>
  <defs><linearGradient id="bg6" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6B3A2A"/><stop offset="100%" stop-color="#2C1810"/></linearGradient></defs>
  <rect width="400" height="300" fill="url(#bg6)" opacity="0.4"/>
  <!-- Cup -->
  <path d="M140 110 L150 230 Q150 240 160 240 L240 240 Q250 240 250 230 L260 110 Z" fill="#D2A679"/>
  <!-- Chai liquid -->
  <rect x="152" y="130" width="96" height="95" fill="#C08040" rx="2"/>
  <!-- Foam top -->
  <ellipse cx="200" cy="125" rx="52" ry="10" fill="#F5E6D3"/>
  <!-- Cinnamon stick -->
  <rect x="210" y="80" width="6" height="100" rx="3" fill="#8B4513" transform="rotate(10, 213, 130)"/>
  <!-- Star anise decoration -->
  <polygon points="180,95 183,102 190,102 185,107 187,115 180,110 173,115 175,107 170,102 177,102" fill="#DAA520" opacity="0.6" transform="scale(0.7) translate(80, 30)"/>
  <!-- Steam -->
  <path d="M185 105 Q180 85 190 70" stroke="#F5E6D3" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M205 100 Q200 80 210 65" stroke="#F5E6D3" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
  <text x="200" y="275" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#DAA520" letter-spacing="3">CHAI LATTE</text>
</svg>
